<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALD1 翻譯網站</title>
    <link rel="icon" type="image/png" href="https://github.com/ald1a1mem.png">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f4f8fb;
            --card-bg: #ffffff;
            --text-color: #3b5973;
            --light-blue: #e6f0f7;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Noto Sans TC', 'Fredoka', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 網頁頂部標頭 */
        .brand-header {
            text-align: center;
            padding: 30px 20px 15px 20px;
        }
        
        .brand-title {
            font-size: 2.6rem;
            color: #638da3 !important;
            margin: 0;
            font-weight: 700;
            letter-spacing: 3px;
        }

        /* 網頁頂部 Tab 切換鍵按鈕列 */
        .tab-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            background: #ffffff;
            padding: 8px 15px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(86, 152, 195, 0.1);
            margin-bottom: 30px;
            max-width: 95%;
            flex-wrap: wrap;
            border: 2px solid var(--light-blue);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-color);
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            background: var(--light-blue);
            color: #03A9F4;
        }

        /* 各分頁按鈕啟動時的專屬色彩 */
        .tab-buttons .tab-btn.active:nth-child(1) {
            background-color: #9FB5C3 !important;
            color: #ffffff !important;
            box-shadow: 0 4px 0px #ad1457 !important;
        }
        .tab-buttons .tab-btn.active:nth-child(2) {
            background-color: #c48b59 !important;
            color: #ffffff !important;
            box-shadow: 0 4px 0px #e65100 !important;
        }
        .tab-buttons .tab-btn.active:nth-child(3) {
            background-color: #5b8c76 !important;
            color: #ffffff !important;
            box-shadow: 0 4px 0px #b87070 !important;
        }
        .tab-buttons .tab-btn.active:nth-child(4) {
            background-color: #00bcd4 !important;
            color: #ffffff !important;
            box-shadow: 0 4px 0px #00838f !important;
        }

        /* 內容容器 */
        .container {
            max-width: 850px;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tab-content {
            display: none;
            width: 100%;
        }

        .tab-content.active {
            display: block;
        }

        /* 主卡片容器 */
        .card {
            background: var(--card-bg);
            border-width: 4px;
            border-style: solid;
            border-radius: 28px;
            padding: 35px 25px;
            box-shadow: 0 10px 0px rgba(86, 152, 195, 0.15);
            position: relative;
            margin-bottom: 35px;
        }

        .card::before {
            content: '● ●';
            position: absolute;
            top: 12px;
            left: 20px;
            opacity: 0.4;
            font-size: 0.8rem;
            letter-spacing: 3px;
        }

        h2 {
            font-size: 1.7rem;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }

        /* 卡片網格樣式 */
.custom-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 240px)); /* 強制每張卡片固定寬度為 240px */
    gap: 20px;
    justify-content: start; /* 靠左對齊，不會被自動拉寬 */
}

        .custom-card {
            background: #ffffff;
            border-width: 3px;
            border-style: solid;
            border-radius: 22px;
            overflow: hidden;
            text-decoration: none;
            box-shadow: 0 6px 16px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            transition: all 0.2s ease;
        }

        .custom-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 22px rgba(0,0,0,0.1);
        }

        .custom-img-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #eee;
        }

        .custom-img-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .custom-info {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .custom-title {
            font-size: 1.05rem;
            font-weight: 700;
            line-height: 1.4;
        }

        .custom-members {
            font-size: 0.88rem;
            line-height: 1.5;
        }

        .custom-date {
            font-size: 0.85rem;
            margin-top: 2px;
        }

        footer {
            margin: 20px 0 30px 0;
            font-size: 0.85rem;
            color: #a0b9cc;
            text-align: center;
            width: 100%;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="brand-header">
        <div class="brand-title">ALD1 翻譯網站</div>
    </div>

    <!-- 上方分頁按鈕列 -->
    <div class="tab-buttons">
        <button class="tab-btn active" onclick="showTab('tab-lyrics', this)">🎵 歌詞</button>
        <button class="tab-btn" onclick="showTab('tab-shows', this)">📺 節目</button>
        <button class="tab-btn" onclick="showTab('tab-lives', this)">🔴 直播</button>
        <button class="tab-btn" onclick="showTab('tab-media', this)">📰 媒體</button>
    </div>

    <div class="container">

        <!-- ================= 分頁 1：歌詞 ================= -->
<div id="tab-lyrics" class="tab-content active">
            <style>
                #tab-lyrics .card { border-color: #9FB5C3 !important; }
                #tab-lyrics h2, #tab-lyrics .custom-title, #tab-lyrics .custom-members, #tab-lyrics .custom-date { color: #9FB5C3 !important; }
                #tab-lyrics .custom-card { border-color: #9FB5C3 !important; }
                #tab-lyrics .card::before { display: none !important; }
            </style>
            <style>
                .tab-buttons .tab-btn.active:nth-child(1) {
                    background-color: #9FB5C3 !important;
                    color: #ffffff !important;
                    box-shadow: 0 4px 0px #7a94a2 !important;
                }
            </style>

<div class="card">
    <h2>No School Tomorrow</h2>
    <div class="custom-grid">
        <a href="https://www.youtube.com/watch?v=cImgLX-9Co0" class="custom-card" target="_blank">
            <div class="custom-img-container">
                <img src="https://img.youtube.com/vi/cImgLX-9Co0/mqdefault.jpg" alt="縮圖">
            </div>
            <div class="custom-info">
                <div class="custom-title">ALPHA DRIVE ONE - Good Life</div>
            </div>
        </a>
    </div>
</div>

        </div>

        <!-- ================= 分頁 2：節目 ================= -->
<div id="tab-shows" class="tab-content">
            <style>
                #tab-shows .card { border-color: #A39797 !important; }
                #tab-shows h2, #tab-shows .custom-title, #tab-shows .custom-members, #tab-shows .custom-date { color: #A39797 !important; }
                #tab-shows .custom-card { border-color: #A39797 !important; }
                #tab-shows .card::before { display: none !important; }
            </style>
            <style>
                .tab-buttons .tab-btn.active:nth-child(2) {
                    background-color: #A39797 !important;
                    color: #ffffff !important;
                    box-shadow: 0 4px 0px #827575 !important;
                }
            </style>

<div class="card">
    <h2>SBS</h2>
    <div class="custom-grid">
        <a href="https://ald1a1mem.github.io/260726-MC/" class="custom-card" target="_blank">
            <div class="custom-img-container">
                <img src="https://img.youtube.com/vi/GHwLU2pNKPo/mqdefault.jpg" alt="縮圖">
            </div>
            <div class="custom-info">
                <div class="custom-title">260726 SBS 人氣歌謠 彝晛 & 俊抒 & 相沅 MC cut 合集</div>
            </div>
        </a>
    </div>
</div>

        </div>

        <!-- ================= 分頁 3：直播 ================= -->
<div id="tab-lives" class="tab-content">
            <style>
                #tab-lives .card { border-color: #CBA29E !important; }
                #tab-lives h2, #tab-lives .custom-title, #tab-lives .custom-members, #tab-lives .custom-date { color: #CBA29E !important; }
                #tab-lives .custom-card { border-color: #CBA29E !important; }
                #tab-lives .card::before { display: none !important; }
            </style>
            <style>
                .tab-buttons .tab-btn.active:nth-child(3) {
                    background-color: #CBA29E !important;
                    color: #ffffff !important;
                    box-shadow: 0 4px 0px #a9807c !important;
                }
            </style>


        </div>

        <!-- ================= 分頁 4：媒體 ================= -->
<div id="tab-media" class="tab-content">
            <style>
                #tab-media .card { border-color: #C3B3CF !important; }
                #tab-media h2, #tab-media .custom-title, #tab-media .custom-members, #tab-media .custom-date { color: #C3B3CF !important; }
                #tab-media .custom-card { border-color: #C3B3CF !important; }
                #tab-media .card::before { display: none !important; }
            </style>
            <style>
                .tab-buttons .tab-btn.active:nth-child(4) {
                    background-color: #C3B3CF !important;
                    color: #ffffff !important;
                    box-shadow: 0 4px 0px #9f8fae !important;
                }
            </style>

        </div>

    </div>

    <footer>
        &copy; ald1.a1mem
    </footer>

    <!-- 分頁切換 JavaScript 程式碼 -->
    <script>
        function showTab(tabId, btnElement) {
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => content.classList.remove('active'));

            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }
    </script>
</body>
</html>
